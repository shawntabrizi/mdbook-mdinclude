[package]
name = "mdbook-mdinclude"
description = "An mdBook preprocessor for better markdown file inclusion."
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
repository = "https://github.com/shawntabrizi/mdbook-mdinclude"
license = "MIT"
keywords = ["mdbook", "preprocessor", "markdown", "include"]
categories = ["command-line-utilities", "text-processing"]
exclude = [".github/"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
mdbook = "0.4.37"
regex = "1"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
